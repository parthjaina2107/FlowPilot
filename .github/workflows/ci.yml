name: FlowPilot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Validation & Health Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Backend Imports & Syntax
        run: |
          cd backend
          python -c "import fastapi, uvicorn, chromadb, sentence_transformers; print('Core modules successfully loaded.')"

      - name: Seed Database & Verify ChromaDB Vector Store
        run: |
          cd backend
          python seed_flows.py

      - name: Run Backend Health & Verification Suite
        run: |
          cd backend
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          cd ..
          python test_flowpilot.py
